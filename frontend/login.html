<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Order Management Dashboard</title>
  <meta name="description" content="Admin login for Order Management Dashboard" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">📦</div>
      <h1>Order Management</h1>
      <p>Admin Dashboard &mdash; Secure Login</p>
    </div>

    <div class="alert-error" id="loginError">⚠ Invalid username or password</div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter admin username"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Sign In to Dashboard
      </button>
    </form>

    
  <script src="js/login.js"></script>
</body>
</html>
